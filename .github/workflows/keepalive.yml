name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 2 days at 06:00 UTC (well within Supabase's 7-day idle pause window)
    - cron: '0 6 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keepalive Endpoint
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" https://decode-dusky.vercel.app/api/cron/keepalive)
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -ne 200 ]; then
            echo "Keepalive ping returned status: $STATUS"
            # Do not fail hard to avoid GitHub Actions disable warnings if app is rebuilding
            exit 0
          fi
